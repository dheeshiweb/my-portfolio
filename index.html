
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #090919,
                #17133b,
                #32165b
            );
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 950px;
            text-align: center;
            padding: 60px 25px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 80px;
            color: #c4a5ff;
        }
    

        .welcome {
            color: #c4a5ff;
            letter-spacing: 3px;
            font-size: 14px;;
            margin-bottom: 20px;
        }
        
       .profile {
            width: 190px;
            height: 190px;

            margin: 0 auto 35px;

            border-radius: 50%;

            padding: 5px;

            background: linear-gradient(
                135deg,
                #8e54e9,
                #c06cff,
                #ffffff,
                #8e54e9
            );

            

            
        }

        .profile img {
            width: 100%;
            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #17133b;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
            font-family: 'Georgio',serif;
        }

        h1 span {
        
            color: #b78aff;
        }

        .description {
            font-size: 17px;
            color: #c6c3d8;
            line-height: 1.8;
            max-width: 650px;
            margin: auto;
            margin-bottom: 40px;
        }

        .button {
            display: inline-block;
            text-decoration: none;
            padding: 16px 35px;
            border-radius: 35px;
            background: linear-gradient(
                90deg,
                #8e54e9,
                #c06cff
            );
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 0 25px #9b5cff55;
        }

        .button:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 35px #b77aff;
        }

        .footer {
            margin-top: 100px;
            font-size: 13px;
            color: #aaa3c2;
        }

        @media(max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .description {
                font-size: 14px;
            }

            .logo {
                margin-bottom: 60px;
            }

            .footer {
                margin-top: 70px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            MY PORTFOLIO
        </div>

       <b> <p class="welcome">
            WELCOME TO MY DIGITAL SPACE!!
        </p></b>

       <div class="profile">
            <img src="images/dharshini.png"
                 alt="Dharshini Profile Photo">
       </div>
        <h1>
            Hello, I'm <span>Dharshini</span>
        </h1>

        <p class="description">
            A passionate Computer Science Engineering student
            who loves learning new technologies, developing
            creative ideas and building amazing projects.
        </p>

        <a href="portfolio.html" class="button">
            View My Portfolio →
        </a>

        

    </div>

</body>
</html>
